name: D2G Oncology
description: >-
  D2G Oncology is a precision-oncology company based in Mountain View, California, reported to have
  been founded in 2018 by Ian Winters. Public company descriptions characterize its work as applying
  quantitative and multiplexed functional cancer genomics to relate drugs to genotypes in order to
  advance precision cancer therapeutics. The company operates INSITE, a login-gated internal research
  portal at www.d2g-insite.com supporting preclinical study management and result exploration. D2G
  Oncology publishes no public developer API program, no developer portal, no API documentation, and
  no client SDKs, and third-party company trackers list the company as inactive as of 2026. It was
  surfaced through the Lightspeed Venture Partners portfolio and is retained here as an identity-only
  profile.
